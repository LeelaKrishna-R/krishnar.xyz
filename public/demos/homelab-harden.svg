<text class="ttl" x="398" y="21" text-anchor="middle">homelab-harden --demo · a real run</text>
<g class="ln l0"><text x="20" y="63.5"><tspan class="gold">$</tspan> python3 -m homelab_harden --demo</text><g class="cv c0"><rect x="35.260000000000005" y="50" width="276.4" height="19.5" fill="#1d1712"/><rect class="cur" x="36.260000000000005" y="51" width="7.1" height="16.5" fill="#f0b429"/></g></g><text class="ln l1" x="20" y="83"><tspan class="gold">homelab-harden</tspan>  linux (sample) host</text><text class="ln l3" x="20" y="122">  <tspan class="red">[HIGH]</tspan> SSH permits direct root login (PermitRootLogin yes)</text><text class="ln l4" x="20" y="141.5"><tspan class="dim">         -&gt; Set `PermitRootLogin no` in /etc/ssh/sshd_config and reload sshd</tspan></text><text class="ln l5" x="20" y="161">  <tspan class="red">[HIGH]</tspan> SSH allows password authentication</text><text class="ln l6" x="20" y="180.5"><tspan class="dim">         -&gt; Set up key-based login, then set `PasswordAuthentication no` and reload sshd</tspan></text><text class="ln l7" x="20" y="200">  <tspan class="red">[HIGH]</tspan> No active host firewall (ufw is not filtering traffic)</text><text class="ln l8" x="20" y="219.5"><tspan class="dim">         -&gt; Enable a firewall, e.g. `ufw default deny incoming &amp;&amp; ufw enable`</tspan></text><text class="ln l9" x="20" y="239">  <tspan class="red">[HIGH]</tspan> PostgreSQL is listening on all interfaces at port 5432 (postgres)</text><text class="ln l10" x="20" y="258.5"><tspan class="dim">         -&gt; Bind it to 127.0.0.1 or a LAN IP, or firewall the port; do not expose PostgreSQL</tspan></text><text class="ln l11" x="20" y="278">  <tspan class="amber">[MED ]</tspan> Automatic security updates are not enabled</text><text class="ln l12" x="20" y="297.5"><tspan class="dim">         -&gt; Enable unattended-upgrades (Debian/Ubuntu) or dnf-automatic.timer (RHEL/Fedora)</tspan></text><text class="ln l13" x="20" y="317">  <tspan class="amber">[MED ]</tspan> fail2ban is not running (no brute-force protection for SSH)</text><text class="ln l14" x="20" y="336.5"><tspan class="dim">         -&gt; Install and enable it: `apt install fail2ban &amp;&amp; systemctl enable --now fail2ban`</tspan></text><text class="ln l15" x="20" y="356">  <tspan class="amber">[MED ]</tspan> Passwordless sudo is configured (1 NOPASSWD rule(s))</text><text class="ln l16" x="20" y="375.5"><tspan class="dim">         -&gt; Remove NOPASSWD from sudoers entries unless a specific automation needs it</tspan></text><text class="ln l18" x="20" y="414.5"><tspan class="b">  4 high, 3 medium, 0 low</tspan></text><text class="ln l19" x="20" y="434"><tspan class="dim">  note: sample data shown by --demo; run without --demo on a Linux host to audit it</tspan></text>
</svg>
