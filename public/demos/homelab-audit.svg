<text class="ttl" x="459" y="21" text-anchor="middle">homelab-audit · a real run</text>
<g class="ln l0"><text x="20" y="63.5"><tspan class="gold">$</tspan> npx homelab-audit docs/demo/docker-compose.yml</text><g class="cv c0"><rect x="35.260000000000005" y="50" width="390.2" height="19.5" fill="#1d1712"/><rect class="cur" x="36.260000000000005" y="51" width="7.1" height="16.5" fill="#f0b429"/></g></g><text class="ln l1" x="20" y="83"><tspan class="gold">homelab-audit</tspan>  docs/demo/docker-compose.yml</text><text class="ln l3" x="20" y="122">  <tspan class="red">[HIGH]</tspan> app  Runs in privileged mode (full access to host devices)</text><text class="ln l4" x="20" y="141.5"><tspan class="dim">         -&gt; Remove `privileged: true`; grant only the specific `cap_add` it needs</tspan></text><text class="ln l5" x="20" y="161">  <tspan class="red">[HIGH]</tspan> db  Hardcoded secret in environment: POSTGRES_PASSWORD</text><text class="ln l6" x="20" y="180.5"><tspan class="dim">         -&gt; Move it to a git-ignored `.env` file, Docker secrets, or a `${VAR}` reference from the host env</tspan></text><text class="ln l7" x="20" y="200">  <tspan class="red">[HIGH]</tspan> db  PostgreSQL port 5432 is published to all interfaces (0.0.0.0)</text><text class="ln l8" x="20" y="219.5"><tspan class="dim">         -&gt; Bind to a specific host, e.g. "127.0.0.1:5432:5432", or put it behind a reverse proxy</tspan></text><text class="ln l9" x="20" y="239">  <tspan class="amber">[MED ]</tspan> app  Uses host network mode (no network isolation from the host)</text><text class="ln l10" x="20" y="258.5"><tspan class="dim">         -&gt; Use a bridge network and publish only the ports you need</tspan></text><text class="ln l11" x="20" y="278">  <tspan class="blue">[LOW ]</tspan> cache  Image uses the :latest tag: redis:latest</text><text class="ln l12" x="20" y="297.5"><tspan class="dim">         -&gt; Pin a specific version tag so updates are intentional</tspan></text><text class="ln l14" x="20" y="336.5"><tspan class="b">  3 high, 1 medium, 1 low</tspan></text>
